<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 4‑Year Anniversary</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Roboto,sans-serif;
        }
        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            background: linear-gradient(135deg,#fff7f9,#ffe8ee,#fff0f3);
            text-align:center;
            padding:2rem;
        }
        .container{
            max-width:600px;
        }
        h1{
            font-size:clamp(2rem,6vw,3.2rem);
            color:#c85a78;
            margin-bottom:1rem;
        }
        .subtitle{
            font-size:1.15rem;
            color:#777;
            margin-bottom:3rem;
            line-height:1.7;
        }
        .enter-btn{
            display:inline-block;
            text-decoration:none;
            padding:1rem 2.8rem;
            font-size:1.2rem;
            font-weight:500;
            background:#c85a78;
            color:white;
            border-radius:50px;
            box-shadow:0 6px 18px rgba(200,90,120,0.22);
            transition: all 0.3s ease;
        }
        .enter-btn:hover{
            background:#b04c67;
            transform: translateY(-4px);
        }
        .heart-deco{
            font-size:4rem;
            margin-bottom:1.5rem;
            color:#c85a78;
        }
        footer{
            position:absolute;
            bottom:2rem;
            left:0;
            width:100%;
            color:#999;
            font-size:0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart-deco">❤</div>
        <h1>Happy 4 Years Together</h1>
        <p class="subtitle">A special anniversary page made just for us. <br> Click below to open our memory journey.</p>
        <a href="letter.html" class="enter-btn">Open Our Anniversary Page 💌</a>
    </div>
    <footer>Made with unconditional love</footer>
</body>
</html>
